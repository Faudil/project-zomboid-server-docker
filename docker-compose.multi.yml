x-common: &common
  image: ghcr.io/faudil/project-zomboid-server-docker:latest
  restart: unless-stopped
  stop_grace_period: 120s
  init: true
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  env_file:
    - .env
  # NOTE: both instances share the same read-write ./server-files mount.
  # A simultaneous game update from both containers can corrupt the install,
  # so stage updates one server at a time (profiles make this easy: start
  # one, wait for it to become healthy, then start the other).
  volumes:
    - ./server-files:/home/steam/pzserver

services:
  zomboid-server1:
    <<: *common
    container_name: pz-server1
    profiles: ["server1"]
    environment:
      - SERVER_NAME=server1
      - PUBLIC_NAME=Server One
      - DEFAULT_PORT=16261
      - UDP_PORT=16262
      - RCON_PORT=27015
      - MAX_PLAYERS=16
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    volumes:
      - ./data-server1:/home/steam/Zomboid
      - ./backups-server1:/home/steam/Zomboid/backups

  zomboid-server2:
    <<: *common
    container_name: pz-server2
    profiles: ["server2"]
    environment:
      - SERVER_NAME=server2
      - PUBLIC_NAME=Server Two
      - DEFAULT_PORT=16263
      - UDP_PORT=16264
      - RCON_PORT=27016
      - MAX_PLAYERS=8
    ports:
      - "16263:16263/udp"
      - "16264:16264/udp"
      - "27016:27016/tcp"
    volumes:
      - ./data-server2:/home/steam/Zomboid
      - ./backups-server2:/home/steam/Zomboid/backups
